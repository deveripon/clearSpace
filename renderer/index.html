<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clearspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Sections">
      <div class="drag sidebar-drag"></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-view="settings" id="nav-settings">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm6.2 3.3-1.3-.3a5 5 0 0 1-.4 1l.7 1.1-1.3 1.3-1.1-.7a5 5 0 0 1-1 .4l-.3 1.3H7.5l-.3-1.3a5 5 0 0 1-1-.4l-1.1.7-1.3-1.3.7-1.1a5 5 0 0 1-.4-1l-1.3-.3V7.2l1.3-.3c.1-.4.2-.7.4-1l-.7-1.1 1.3-1.3 1.1.7c.3-.2.6-.3 1-.4l.3-1.3h1.8l.3 1.3c.4.1.7.2 1 .4l1.1-.7 1.3 1.3-.7 1.1c.2.3.3.6.4 1l1.3.3v1.6Z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar drag">
        <div class="toolbar-title" id="toolbar-title">Overview</div>
        <div class="toolbar-right no-drag">
          <span class="muted small" id="scanned-at"></span>
          <button class="btn btn-quiet" id="btn-rescan" type="button">
            <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Scan again
          </button>
        </div>
      </header>

      <section class="capacity" id="capacity" aria-label="Disk space"></section>

      <div class="view" id="view" tabindex="-1"></div>

      <footer class="actionbar" id="actionbar"></footer>
    </main>
  </div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <script src="app.js"></script>
</body>
</html>
